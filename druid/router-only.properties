# Variant A: the docs taken literally ("pac4j ... should only be used at the router").
# Appended to conf/druid/oidc-router-only/router/runtime.properties.
# All other services keep Druid's defaults, i.e. NO authentication at all.
druid.auth.authenticatorChain=["pac4j"]
druid.auth.authenticator.pac4j.type=pac4j
# Not in the docs' property table, but required: pac4j needs an authorizer to hand users to.
druid.auth.authenticator.pac4j.authorizerName=allowAll
druid.auth.pac4j.cookiePassphrase=a-long-and-not-so-random-test-passphrase-123
druid.auth.pac4j.oidc.clientID=druid
druid.auth.pac4j.oidc.clientSecret=druid-client-secret
druid.auth.pac4j.oidc.discoveryURI=http://localhost:18080/realms/druid/.well-known/openid-configuration
# Without this, pac4j auto-selects private_key_jwt (listed first by Keycloak) and every login
# fails with "TechnicalException: privateKeyJwtConfig cannot be null".
druid.auth.pac4j.oidc.clientAuthenticationMethod=client_secret_basic

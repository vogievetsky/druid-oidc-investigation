# Variant B: pac4j on EVERY service, so the identity survives the router -> broker/coordinator hop.
# Appended to conf/druid/oidc-all/_common/common.runtime.properties.
#
# "basic" comes first so internal (escalated) service-to-service traffic authenticates with the
# druid_system user; browser requests carry no Authorization header, fall through to pac4j, and
# the broker/coordinator re-authenticate the user from the pac4j cookie the router forwards.
druid.auth.authenticatorChain=["basic", "pac4j"]

druid.auth.authenticator.basic.type=basic
druid.auth.authenticator.basic.initialAdminPassword=admin
druid.auth.authenticator.basic.initialInternalClientPassword=internal
druid.auth.authenticator.basic.authorizerName=allowAll

druid.escalator.type=basic
druid.escalator.internalClientUsername=druid_system
druid.escalator.internalClientPassword=internal
druid.escalator.authorizerName=allowAll

druid.auth.authenticator.pac4j.type=pac4j
druid.auth.authenticator.pac4j.authorizerName=allowAll
# Must be identical on all services: it is the only thing needed to read the session cookie.
druid.auth.pac4j.cookiePassphrase=a-long-and-not-so-random-test-passphrase-123
druid.auth.pac4j.oidc.clientID=druid
druid.auth.pac4j.oidc.clientSecret=druid-client-secret
druid.auth.pac4j.oidc.discoveryURI=http://localhost:18080/realms/druid/.well-known/openid-configuration
druid.auth.pac4j.oidc.clientAuthenticationMethod=client_secret_basic
